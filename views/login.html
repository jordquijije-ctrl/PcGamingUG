<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | ComponentesGamingUG</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../public/js/auth.js" defer></script>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; margin: 0; font-family: system-ui, -apple-system, sans-serif;">

    <div style="background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="display: inline-flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; text-decoration: none;">
                <i class="ph-fill ph-game-controller" style="font-size: 2.2rem; color: #3b82f6;"></i>
                <span style="color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: 1px; text-transform: uppercase;">COMPONENTES GAMING UG</span>
            </div>
            <h2 style="color: #fff; margin: 0; font-size: 1.4rem; font-weight: 700;">Bienvenido de nuevo</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.4rem; margin-bottom: 0;">Ingresa tus credenciales para acceder a tu cuenta</p>
        </div>

        <div id="error-container" style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1.25rem; align-items: center; gap: 0.5rem; box-sizing: border-box;">
            <i class="ph ph-warning-circle" style="font-size: 1.2rem; flex-shrink: 0;"></i>
            <span id="error-text"></span>
        </div>

        <form id="login-form" novalidate>
            <div style="margin-bottom: 1.25rem;">
                <label for="email" style="display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 500;">Correo Electrónico</label>
                <div style="position: relative;">
                    <i class="ph ph-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.15rem;"></i>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" style="width: 100%; background: #0f172a; border: 1px solid #334155; padding: 12px 14px 12px 42px; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; font-size: 0.95rem; transition: border-color 0.2s;">
                </div>
            </div>

            <div style="margin-bottom: 1.75rem;">
                <label for="password" style="display: block; color: #cbd5e1; font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 500;">Contraseña</label>
                <div style="position: relative;">
                    <i class="ph ph-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.15rem;"></i>
                    <input type="password" id="password" placeholder="••••••••" style="width: 100%; background: #0f172a; border: 1px solid #334155; padding: 12px 14px 12px 42px; border-radius: 8px; color: #fff; box-sizing: border-box; outline: none; font-size: 0.95rem; transition: border-color 0.2s;">
                </div>
            </div>

            <button type="submit" style="width: 100%; background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
                <i class="ph ph-sign-in" style="font-size: 1.1rem;"></i> Iniciar Sesión
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #334155; padding-top: 1.25rem;">
            <a href="index.html" style="color: #94a3b8; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.2s;" onmouseover="this.style.color='#cbd5e1'" onmouseout="this.style.color='#94a3b8'">
                <i class="ph ph-arrow-left"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => input.style.borderColor = '#3b82f6');
            input.addEventListener('blur', () => input.style.borderColor = '#334155');
        });
    </script>
</body>
</html>
